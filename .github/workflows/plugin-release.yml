name: plugin-release

# Tags each published version of the dvt Claude Code plugin.
#
# This file is PUBLISHED into getdvt/dvt-plugin — it is rendered from
# plugins/.github/workflows/plugin-release.yml in the private getdvt/dvt repo and
# pushed by the dvt-publisher App. Do not edit it in the public repo; edit it here.
# (It lives under plugins/.github/ so it is payload, not a workflow of this repo —
# only a repo's ROOT .github/workflows runs.)
#
# SEC-153 split: this used to be a two-job workflow. `version-bump-check` gated PRs in
# the public repo, but that repo is now publish-only and takes no PRs — so that job
# moved upstream to getdvt/dvt's .github/workflows/plugin-validate.yml, where the PR
# that actually changes the plugin lives. What remains is `tag-on-merge`, which belongs
# on the public artifact: tags and releases are consumed from the public repo.
#
# (DVT-3298: zero tags had ever been pushed across 47 merged PRs because nothing
# automated it.) Must stay idempotent — a re-run, or a publish that doesn't bump the
# version, must not red this job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_JSON: plugins/dvt/.claude-plugin/plugin.json

jobs:
  tag-on-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job pushes the tag
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (SHA-pinned; Dependabot bumps)
        with:
          fetch-depth: 0

      - name: Tag v<version> if not already tagged
        run: |
          set -euo pipefail
          ver=$(python3 -c "import json; print(json.load(open(\"$PLUGIN_JSON\"))['version'])")
          tag="v$ver"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists locally — nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          # Tolerant push: a rejected ref because another run already created this exact
          # tag is not a failure (concurrency block was removed — it cancelled PENDING
          # runs and could permanently drop a tag; see DVT-3298 M2). A genuine push
          # failure still reds.
          git push origin "$tag" || git ls-remote --exit-code --tags origin "refs/tags/$tag"
          echo "Tagged and pushed $tag."
